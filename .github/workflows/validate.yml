name: Validate ProjectDB plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate the distributable plugin
        run: node scripts/validate.mjs
      - name: Verify automatic publication against a local Git remote
        run: node scripts/test-publish.mjs
