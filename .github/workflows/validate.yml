name: Validate ProjectDB plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate the distributable plugin
        run: node scripts/validate.mjs
      - name: Verify automatic publication against a local Git remote
        run: node scripts/test-publish.mjs
      - name: Verify Windows author setup with a different repository owner
        if: runner.os == 'Windows'
        run: node scripts/test-setup.mjs
